[platformio]
default_envs = station

; Active DevKit firmware: fill telemetry, camera arrival consumer and calibrated servos.
[env:station]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 57600
build_src_filter = +<station.cpp>
build_flags = -D ACTUATORS_ENABLED=0 -D TEST_FILL_SENSOR=1 -D TEST_CAMERA_SERIAL=1 -D STATION_CONTROLLER=1 -D BENCH_CLASSIFIER_GPIO=27 -D BENCH_OPENER_GPIO=33
lib_deps =
    256dpi/MQTT@2.5.3
    bblanchon/ArduinoJson@7.4.3
