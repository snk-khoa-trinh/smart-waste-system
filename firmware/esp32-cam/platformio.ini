[platformio]
default_envs = camera

; Active ESP32-CAM firmware: inlet, fresh JPEG capture, HTTP and authenticated OTA.
[env:camera]
platform = espressif32@6.12.0
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 115200
board_build.partitions = min_spiffs.csv
build_src_filter = +<camera.cpp>
; Preserve the tested feature switches and private configuration header format.
build_flags = -D ACTUATORS_ENABLED=0 -D TEST_CAMERA_UPLOAD=1 -D TEST_INLET=1 -D TEST_ROBOFLOW=1
lib_deps =
    256dpi/MQTT@2.5.3
    bblanchon/ArduinoJson@7.4.3
